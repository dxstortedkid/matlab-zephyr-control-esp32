# ==============================================================================
# C++ Toolchain Support
# ==============================================================================
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# ==============================================================================
# USB Console & Floating-Point Debugging
# ==============================================================================
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Required to print float/double sensor values via printk/printf
CONFIG_CBPRINTF_FP_SUPPORT=y

# Note: Hardware USB Serial/JTAG controller is enabled automatically:
# CONFIG_ESP_USB_SERIAL_JTAG_ENABLED=y  (Default: 'y' on ESP32-C3)

# ==============================================================================
# Sensor Subsystem (MPU6050)
# ==============================================================================
CONFIG_SENSOR=y

# Use periodic polling mode (no physical INT interrupt pin connected)
CONFIG_MPU6050_TRIGGER_NONE=y

# Note: The following are auto-enabled via DeviceTree & driver dependencies:
# CONFIG_I2C=y                          (Selected by MPU6050 driver)
# CONFIG_MPU6050=y                      (Enabled by 'invensense,mpu6050' overlay node)